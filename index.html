<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARI Topology — Azure Estate Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8eef5;
        --bg: #0b0f14;
        --accent: #6cf;
        --rust: #c97a3a;
      }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      #canvas-root { position: fixed; inset: 0; }
      canvas { display: block; }

      #landing {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #142033 0%, #0b0f14 70%);
        z-index: 10;
      }
      #drop {
        border: 2px dashed #3a4a60;
        border-radius: 14px;
        padding: 48px 64px;
        text-align: center;
        max-width: 560px;
        transition: border-color .15s, background .15s;
      }
      #drop.dragover { border-color: var(--accent); background: rgba(102,204,255,0.06); }
      #drop h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .3px; }
      #drop p { margin: 6px 0; color: #9fb1c7; font-size: 14px; line-height: 1.45; }
      #drop button {
        margin-top: 18px;
        background: var(--accent); color: #03121f; border: 0;
        padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;
      }
      #drop button:hover { filter: brightness(1.1); }
      #drop input { display: none; }

      #log {
        margin-top: 16px; text-align: left; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: #8aa0b8; max-height: 160px; overflow: auto;
        white-space: pre-wrap;
      }

      #stats {
        position: fixed; top: 12px; left: 12px; z-index: 5;
        background: rgba(10,16,22,0.78); backdrop-filter: blur(6px);
        padding: 10px 12px; border-radius: 8px; font-size: 12px;
        line-height: 1.5; max-width: 320px; color: #cfdcec;
        border: 1px solid #20303f;
      }
      #stats b { color: var(--fg); }
      #stats .k { color: #6cf; }

      #legend {
        position: fixed; bottom: 12px; right: 12px; z-index: 5;
        background: rgba(10,16,22,0.78); backdrop-filter: blur(6px);
        padding: 10px 12px; border-radius: 8px; font-size: 12px;
        color: #cfdcec; border: 1px solid #20303f;
      }
      #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #legend .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0006; }

      #tooltip {
        position: fixed; left: 50%; top: 50%; transform: translate(20px, 20px);
        z-index: 5;
        background: rgba(10,16,22,0.92); backdrop-filter: blur(8px);
        padding: 8px 10px; border-radius: 6px; font-size: 12px;
        color: #e8eef5; border: 1px solid #2a3d52; pointer-events: none;
        max-width: 320px; line-height: 1.4;
        display: none;
      }
      #tooltip b { color: #6cf; }

      #crosshair {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 6px; height: 6px; border-radius: 50%;
        background: #fff8; box-shadow: 0 0 0 1px #0008;
        z-index: 4; pointer-events: none; display: none;
      }

      #lockprompt {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        z-index: 4; padding: 10px 14px; border-radius: 8px;
        background: rgba(10,16,22,0.85); border: 1px solid #2a3d52;
        font-size: 13px; color: #cfdcec; pointer-events: none;
        display: none;
      }

      #reset {
        position: fixed; bottom: 12px; left: 12px; z-index: 5;
        background: #20303f; color: #e8eef5; border: 1px solid #2a3d52;
        padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
        display: none;
      }
      #reset:hover { background: #2a3d52; }

      /* Mode toggle bar */
      #mode-bar {
        position: fixed; top: 12px; right: 12px; z-index: 6;
        display: none; gap: 4px;
      }
      .mode-btn {
        background: #20303f; color: #9fb1c7; border: 1px solid #2a3d52;
        padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
        transition: background .12s, color .12s;
      }
      .mode-btn:hover { background: #2a3d52; }
      .mode-btn.active { background: var(--accent); color: #03121f; border-color: var(--accent); font-weight: 600; }

      /* OS Map container */
      #os-map-root {
        position: fixed; inset: 0;
        display: none;
        overflow: auto;
        background: #2a2a2a;
        align-items: center;
        justify-content: center;
        padding-top: 48px; /* room for control bar */
      }
      #os-map-root svg {
        display: block;
        box-shadow: 0 8px 40px rgba(0,0,0,0.55);
      }

      /* OS Map control bar — shown when OS Map view is active */
      #os-controls {
        position: fixed; top: 0; left: 0; right: 0;
        height: 44px; z-index: 7;
        display: none; align-items: center; gap: 8px;
        padding: 0 12px;
        background: rgba(10,16,22,0.92); backdrop-filter: blur(6px);
        border-bottom: 1px solid #20303f;
      }
      #os-controls label { color: #9fb1c7; font-size: 12px; }
      #os-controls select {
        background: #20303f; color: #e8eef5; border: 1px solid #2a3d52;
        padding: 3px 6px; border-radius: 5px; font-size: 12px; cursor: pointer;
      }
      #os-controls .sep { flex: 1; }
      .tier-btn {
        background: #20303f; color: #9fb1c7; border: 1px solid #2a3d52;
        padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
        transition: background .12s, color .12s;
      }
      .tier-btn:hover { background: #2a3d52; }
      .tier-btn.active { background: #4a7a9b; color: #fff; border-color: #4a7a9b; font-weight: 600; }
      #btn-export, #btn-png, #btn-a3 {
        background: #20303f; color: #9fb1c7; border: 1px solid #2a3d52;
        padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
        transition: background .12s, color .12s;
      }
      #btn-export:hover, #btn-png:hover, #btn-a3:hover { background: #2a3d52; color: #e8eef5; }
      #btn-a3.active { background: #4a7a9b; color: #fff; border-color: #4a7a9b; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="canvas-root"></div>
    <div id="os-map-root"></div>

    <!-- Mode toggle (shown after file load) -->
    <div id="mode-bar">
      <button class="mode-btn active" id="btn-terrain" type="button">🏔 Terrain</button>
      <button class="mode-btn" id="btn-osmap" type="button">🗺 OS Map</button>
    </div>

    <div id="crosshair"></div>
    <div id="lockprompt">Click to look around · WASD to move · Space/Shift up/down · Esc to release</div>
    <div id="tooltip"></div>
    <div id="stats" style="display:none"></div>
    <div id="legend" style="display:none">
      <div style="font-weight:600; margin-bottom:4px;">Legend</div>
      <div class="row"><span class="sw" style="background:#6abf69"></span> Linux VM</div>
      <div class="row"><span class="sw" style="background:#5a8fd1"></span> Windows VM</div>
      <div class="row"><span class="sw" style="background:#9aa6b2"></span> Other / unknown</div>
      <div class="row"><span class="sw" style="background:#c97a3a"></span> VNet peering</div>
      <div class="row"><span class="sw" style="background:#e8eef5"></span> Subnet edge</div>
    </div>
    <button id="reset" type="button">Load another file</button>

    <!-- OS Map control bar (shown when OS Map view is active) -->
    <div id="os-controls">
      <label for="scalar-mode">Elevation:</label>
      <select id="scalar-mode">
        <option value="cost" selected>Monthly cost (£)</option>
        <option value="criticality">Criticality score</option>
        <option value="age">Age (months)</option>
        <option value="blast">Blast radius</option>
        <option value="change">Change freq (30d)</option>
      </select>
      <span style="width:16px"></span>
      <label>Scale tier:</label>
      <button class="tier-btn" id="btn-road" type="button">Road 1:250k</button>
      <button class="tier-btn active" id="btn-land" type="button">Landranger 1:50k</button>
      <button class="tier-btn" id="btn-explorer" type="button">Explorer 1:25k</button>
      <span class="sep"></span>
      <button id="btn-a3" type="button">A3</button>
      <button id="btn-export" type="button">⬇ SVG</button>
      <button id="btn-png" type="button">⬇ PNG</button>
    </div>

    <div id="landing">
      <div id="drop">
        <h1>Azure ARI → Topology</h1>
        <p>Drop your <b>Azure Resource Inventory</b> <code>.xlsx</code> export below.<br/>
           Files stay in your browser — nothing is uploaded or stored.</p>
        <input id="file" type="file" accept=".xlsx,.xlsm,.xlsb" />
        <button id="pick" type="button">Choose file…</button>
        <div id="log"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
